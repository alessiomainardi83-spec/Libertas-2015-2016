<style>

@media (prefers-color-scheme: dark){:root{
  --bg:#150e10; --surface:#21171a; --line:#3a2a2f; --ink:#f3e9ec; --muted:#b9a5ab;
  --brand:#7d1531; --soft:#42202a; --chip:#33252a; --lib:#ff9db3;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:16px;padding-right:16px}
header.top{background:var(--brand);color:var(--brand-ink)}
header.top .wrap{padding-top:18px;padding-bottom:14px;display:flex;align-items:center;gap:14px}
.ball{width:44px;height:44px;flex:none}
h1{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.sub{font-size:14px;opacity:.88;margin-top:3px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--brand);border-top:1px solid rgba(255,255,255,.18)}
nav.tabs .wrap{display:flex;gap:4px}
nav.tabs a{flex:1;text-align:center;color:var(--brand-ink);opacity:.75;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;padding:10px 6px 9px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{opacity:1;border-bottom-color:#fff}
nav.tabs a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
main .wrap{padding-top:18px;padding-bottom:48px;display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--muted)}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.note{color:var(--muted);font-size:14px;margin:0}
.empty{padding:18px;color:var(--muted);font-size:15px}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.badge.aq{background:var(--soft)}
.badge.today{background:var(--brand);color:#fff}
.badge.dbl{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.month + .row{border-top:0}
.date{font-family:var(--f-display);text-align:center;line-height:1}
.date b{display:block;font-size:26px;font-weight:700}
.date span{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.teams{min-width:0;display:flex;flex-direction:column;gap:3px}
.teams .t{font-weight:600;overflow-wrap:anywhere}
.teams .t.lib{color:var(--lib)}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.where{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.score{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.score small{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;margin-top:4px}
.score.w small{color:var(--win)} .score.l small{color:var(--loss)}
.score.todo{font-size:20px;color:var(--ink)}
.score.wait{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:600;max-width:70px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters button:focus-visible{outline:2px solid var(--lib);outline-offset:2px}
.month{font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 14px 4px;border-top:1px solid var(--line);background:var(--bg)}
.month:first-child{border-top:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:8px 10px;text-align:right;border-top:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.lib td{font-weight:700;background:var(--soft)}
.tabhead{padding:12px 14px 4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.tabhead b{font-family:var(--f-display);font-size:20px;text-transform:uppercase}
.tabfoot{padding:8px 14px 12px}
a{color:var(--lib)}
footer{color:var(--muted);font-size:13px;text-align:center}
@media (max-width:420px){.row{grid-template-columns:46px 1fr auto;gap:10px}nav.tabs a{font-size:17px}}
</style>

var MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];

var GIORNI=["dom","lun","mar","mer","gio","ven","sab"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parts(iso){var d=new Date(iso+"T12:00:00");return{g:d.getDate(),m:d.getMonth(),y:d.getFullYear(),wd:GIORNI[d.getDay()]}}
function lungo(iso){var p=parts(iso);return p.g+" "+MESI_L[p.m]+" "+p.y}

  var list=mode==="cal"?ps.filter(function(p){return !played(p)&&p.data>=t}).sort(sortP)

function classifica(c){var T={};

  return Object.keys(T).map(function(k){return T[k]}).sort(function(a,b){return b.pt-a.pt||a.p-b.p||b.v-a.v||SQUADRE[a.k].localeCompare(SQUADRE[b.k])})}

function vClass(){return ["A","E"].map(function(c){var G=GIRONI[c],r=classifica(c);
  return '<section><div class="card"><div class="tabhead"><b>'+G.nome+" "+G.anno+'</b><span class="note">'+G.girone+"</span></div>"+
  '<div class="tablewrap"><table><thead><tr><th>#</th><th>Squadra</th><th>Pt</th><th>G</th><th>V</th><th>P</th></tr></thead><tbody>'+
  r.map(function(x,i){return '<tr class="'+(x.k==="LI"?"lib":"")+'"><td>'+(i+1)+"</td><td>"+esc(SQUADRE[x.k])+"</td><td>"+x.pt+"</td><td>"+x.g+"</td><td>"+x.v+"</td><td>"+x.p+"</td></tr>"}).join("")+
  '</tbody></table></div><p class="note tabfoot">2 punti a vittoria, calcolata sui risultati inseriti. <a href="'+esc(G.url)+'" target="_blank" rel="noopener">Pagina FIP</a></p></div></section>'}).join("")}

function route(){var v=(location.hash||"#calendario").slice(1);return ["calendario","risultati","classifiche"].indexOf(v)>=0?v:"calendario"}
function render(){var v=route();
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs a"),function(a){a.setAttribute("aria-current",a.dataset.v===v?"page":"false")});
  var h=v==="calendario"?vPartite("cal"):v==="risultati"?vPartite("ris"):vClass();
  h+="<footer>Aggiornato al "+lungo(AGGIORNATO)+" · dati FIP Toscana. Gli ultimi risultati possono essere in attesa di conferma ufficiale.</footer>";
  document.getElementById("view").innerHTML=h}
document.addEventListener("click",function(e){var t=e.target.closest("[data-filter]");if(!t)return;S.filter=t.dataset.filter;try{localStorage.setItem("lib1516-filter",S.filter)}catch(e){}render()});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
render();
})();
</script>
</body>
